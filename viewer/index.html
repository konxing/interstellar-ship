<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSX-01「凯洛斯地平线」号 — 三维工作台</title>
<link rel="stylesheet" href="./src/styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header class="brand">
      <h1>DSX-01 <span>凯洛斯地平线号</span></h1>
      <p class="tagline">深空探索飞船 · 交互式三维工作台</p>
    </header>

    <section class="panel">
      <h2>模型</h2>
      <div id="asset-list" class="asset-list"></div>
    </section>

    <section class="panel">
      <h2>系统</h2>
      <div id="system-list" class="system-list"></div>
    </section>

    <section class="panel">
      <h2>视图</h2>
      <div class="row">
        <label for="explode">分解</label>
        <input id="explode" type="range" min="0" max="100" value="0" />
      </div>
      <div class="btn-row" id="camera-presets"></div>
      <div class="toggle-grid">
        <label><input type="checkbox" id="t-wire" /> 线框</label>
        <label><input type="checkbox" id="t-grid" checked /> 网格</label>
        <label><input type="checkbox" id="t-rotate" /> 自动旋转</label>
        <label><input type="checkbox" id="t-spin" checked /> 转动重力环</label>
        <label><input type="checkbox" id="t-stars" checked /> 星空</label>
        <label id="cutaway-row" class="hidden"><input type="checkbox" id="t-cutaway" /> 剖视模式</label>
      </div>
    </section>
  </aside>

  <main id="stage">
    <canvas id="view"></canvas>
    <div id="hud">
      <div id="hud-stats" class="hud-stats"></div>
      <div id="hud-hint" class="hud-hint">拖动旋转 · 滚轮缩放 · 点击部件查看详情</div>
    </div>
    <aside id="info" class="hidden">
      <button id="info-close" title="关闭" aria-label="关闭">×</button>
      <h3 id="info-label"></h3>
      <div id="info-body"></div>
    </aside>
    <div id="loading" class="loading hidden"><span>模型加载中…</span></div>
  </main>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
